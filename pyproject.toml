[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickcontextbuilder"
version = "0.1.0"
description = "Offline, issue-driven context packs with source provenance and bounded size"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "QuickContextBuilder contributors"}]
keywords = ["code-context", "code-search", "ai", "developer-tools"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
qcb = "quickcontext.cli:main"

[tool.setuptools.packages.find]
include = ["quickcontext*"]
